name: Build Android APK (Release)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/BLE-Tracker-Search.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLE-Tracker-Search-APK
          path: release-output/BLE-Tracker-Search.apk
          retention-days: 30

      - name: Publish GitHub Release (Latest)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: latest
          name: "BLE Tracker Search Android (Latest Build)"
          body: |
            ### Automated Android Build
            - Generated automatically from branch `main` (commit `${{ github.sha }}`)
            - Download `BLE-Tracker-Search.apk` below directly to your Android device to install.
          draft: false
          prerelease: false
          files: release-output/BLE-Tracker-Search.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
